# Arquitectura Kafka con ZooKeeper (EP5): ensamble de 3 ZooKeeper + 3 brokers + Kafka UI.
#
#   docker compose -f docker-compose.kafka.yml up -d
#
# - ZooKeeper (zookeeper-1..3): quorum de metadatos del cluster; tolera la caida de 1 nodo.
# - Brokers (kafka-1..3): RF 3 y min.insync.replicas=2 por defecto -> con acks=all no se pierden
#   mensajes aunque caiga 1 broker.
# - kafka-init: crea los topicos del proyecto con sus particiones, replicas y politicas.
# - kafka-ui: administracion de brokers, topicos y consumer groups en http://localhost:8090
#
# Conexion de los microservicios:
#   - Desde el host (IDE / mvn spring-boot:run): KAFKA_BOOTSTRAP_SERVERS=localhost:9092,localhost:9093,localhost:9094
#   - Desde contenedores en la red tallerpro-kafka: KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
#   - En ambos casos KAFKA_REPLICAS=3, para que los NewTopic de los servicios usen RF 3.
#
# Usa los mismos puertos que docker-compose.infra.yml (9092, 8090): levantar uno u otro, no ambos.
# Nota: Kafka 4.0 elimino ZooKeeper (reemplazado por KRaft, que usa docker-compose.prod.yml). Por eso
# este compose usa Confluent Platform 7.7 (Kafka 3.7), la ultima linea que aun soporta ZooKeeper.
name: tallerpro-kafka

x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.7.1
  restart: unless-stopped
  networks:
    - tallerpro-kafka

x-zookeeper-env: &zookeeper-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 5
  ZOOKEEPER_SYNC_LIMIT: 2
  # Puertos 2888 (seguidores -> lider) y 3888 (eleccion de lider) de cada nodo del ensamble.
  ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
  KAFKA_OPTS: -Dzookeeper.4lw.commands.whitelist=ruok,srvr
  KAFKA_HEAP_OPTS: -Xms128m -Xmx256m

# Responde "imok" (sin salto de linea) solo cuando el nodo atiende clientes.
x-zookeeper-healthcheck: &zookeeper-healthcheck
  test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/2181 && echo ruok >&3 && [ \"$$(cat <&3)\" = imok ]"]
  interval: 10s
  timeout: 5s
  retries: 12

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.7.1
  restart: unless-stopped
  depends_on:
    zookeeper-1:
      condition: service_healthy
    zookeeper-2:
      condition: service_healthy
    zookeeper-3:
      condition: service_healthy
  networks:
    - tallerpro-kafka

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
  # INTERNAL: contenedores de la red (kafka-N:9092) · EXTERNAL: procesos en el host (localhost:909x)
  KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # Alta disponibilidad: 3 replicas, se exigen 2 sincronizadas para aceptar escrituras con acks=all.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_NUM_PARTITIONS: 3
  # Los topicos se crean de forma explicita (kafka-init, NewTopic de los servicios o el admin de jobs).
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m

x-kafka-healthcheck: &kafka-healthcheck
  test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
  interval: 10s
  timeout: 10s
  retries: 18

services:
  zookeeper-1:
    <<: *zookeeper
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zk1-data:/var/lib/zookeeper/data
      - zk1-log:/var/lib/zookeeper/log
    healthcheck: *zookeeper-healthcheck

  zookeeper-2:
    <<: *zookeeper
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zk2-data:/var/lib/zookeeper/data
      - zk2-log:/var/lib/zookeeper/log
    healthcheck: *zookeeper-healthcheck

  zookeeper-3:
    <<: *zookeeper
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zk3-data:/var/lib/zookeeper/data
      - zk3-log:/var/lib/zookeeper/log
    healthcheck: *zookeeper-healthcheck

  kafka-1:
    <<: *kafka
    ports:
      - "9092:19092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:9092
    volumes:
      - kafka1-data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  kafka-2:
    <<: *kafka
    ports:
      - "9093:19092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:9093
    volumes:
      - kafka2-data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  kafka-3:
    <<: *kafka
    ports:
      - "9094:19092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:9094
    volumes:
      - kafka3-data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  # Crea los topicos del proyecto (idempotente: --if-not-exists + kafka-configs --alter):
  #   jobs.events              delete, 7 dias   (lo publica jobs; lo consumen report y audit)
  #   audit.timeline           compact          (espejo por orden: lo publica jobs, lo consume audit)
  #   jobs.events.report.DLT   delete, 30 dias  (DLT propio de report)
  #   jobs.events.audit.DLT    delete, 30 dias  (DLT propio de audit)
  #   audit.timeline.DLT       delete, 30 dias  (DLT de audit para audit.timeline)
  # Todos con 3 particiones, RF 3 y min.insync.replicas=2.
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BS=kafka-1:9092,kafka-2:9092,kafka-3:9092
        topico() {
          kafka-topics --bootstrap-server $$BS --create --if-not-exists \
            --topic "$$1" --partitions 3 --replication-factor 3
          kafka-configs --bootstrap-server $$BS --alter \
            --entity-type topics --entity-name "$$1" --add-config "min.insync.replicas=2,$$2"
        }
        topico jobs.events            "cleanup.policy=delete,retention.ms=604800000"
        topico audit.timeline         "cleanup.policy=compact,min.compaction.lag.ms=604800000"
        topico jobs.events.report.DLT "cleanup.policy=delete,retention.ms=2592000000"
        topico jobs.events.audit.DLT  "cleanup.policy=delete,retention.ms=2592000000"
        topico audit.timeline.DLT     "cleanup.policy=delete,retention.ms=2592000000"
        kafka-topics --bootstrap-server $$BS --describe --topics-with-overrides | grep -E "^Topic:" || true
    restart: "no"
    networks:
      - tallerpro-kafka

  kafka-ui:
    image: kafbat/kafka-ui:v1.1.0
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tallerpro
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    networks:
      - tallerpro-kafka

volumes:
  zk1-data:
  zk1-log:
  zk2-data:
  zk2-log:
  zk3-data:
  zk3-log:
  kafka1-data:
  kafka2-data:
  kafka3-data:

networks:
  tallerpro-kafka:
    name: tallerpro-kafka
