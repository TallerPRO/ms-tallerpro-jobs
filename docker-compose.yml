# ms-tallerpro-jobs + su PostgreSQL. Requiere la infraestructura levantada antes
# (../docker-compose.infra.yml): crea la red tallerpro-net, Kafka y RabbitMQ.
#
#   docker compose up -d --build
#
# Publica en Kafka (jobs.events) y en RabbitMQ (cmd.direct -> q.cmd.*) via outbox.
name: tallerpro-jobs

services:
  ms-tallerpro-jobs:
    build: .
    image: tallerpro/ms-tallerpro-jobs:latest
    container_name: ms-tallerpro-jobs
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_HOST: db-jobs
      DB_PORT: 5432
      DB_NAME: tallerpro_jobs
      DB_USER: tallerpro
      DB_PASSWORD: ${JOBS_DB_PASSWORD:-tallerpro}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_REPLICAS: 1
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      CATALOG_SERVICE_URL: http://ms-tallerpro-catalog:8082
      TALLERPRO_JWT_ENABLED: ${TALLERPRO_JWT_ENABLED:-false}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-tenant-id}
      AZURE_API_CLIENT_ID: ${AZURE_API_CLIENT_ID:-api-client-id}
    depends_on:
      db-jobs:
        condition: service_healthy
    networks:
      - tallerpro-net

  db-jobs:
    image: postgres:16-alpine
    container_name: db-jobs
    restart: unless-stopped
    environment:
      POSTGRES_DB: tallerpro_jobs
      POSTGRES_USER: tallerpro
      POSTGRES_PASSWORD: ${JOBS_DB_PASSWORD:-tallerpro}
    volumes:
      - db-jobs-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tallerpro -d tallerpro_jobs"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tallerpro-net

volumes:
  db-jobs-data:

networks:
  tallerpro-net:
    external: true
