spring:
  application:
    name: ms-tallerpro-jobs
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tallerpro_jobs}
    username: ${DB_USER:tallerpro}
    password: ${DB_PASSWORD:tallerpro}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      client-id: ms-tallerpro-jobs
      # Clave = id de la orden (orden por particion y requisito del topico compactado
      # audit.timeline). Valor = JobsEventEnvelope ya serializado a JSON por el outbox.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Durabilidad: el broker confirma cuando las replicas en ISR (min.insync.replicas=2) lo tienen.
      acks: all
      batch-size: 32768
      compression-type: lz4
      properties:
        # Idempotencia: los reintentos internos del productor no duplican ni desordenan mensajes.
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Agrupa hasta 5 ms de eventos por envio (menos requests al broker con carga alta).
        linger.ms: 5
        # El outbox ya reintenta con backoff exponencial: el productor falla pronto (30 s) en vez
        # de bloquear el publicador los 2 min por defecto, y el evento queda para el siguiente ciclo.
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    admin:
      # Aplica las configs de NewTopic (retention.ms) tambien a topicos que ya existian.
      modify-topic-configs: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:tenant-id}/v2.0
          audiences: api://${AZURE_API_CLIENT_ID:api-client-id}

server:
  port: ${SERVER_PORT:8081}

tallerpro:
  security:
    # false -> desarrollo local sin tenant (usuario ficticio con dev-roles). Debe ser true en la nube.
    jwt-enabled: ${TALLERPRO_JWT_ENABLED:true}
    dev-roles: ${TALLERPRO_DEV_ROLES:Admin,JefeTaller}
  # Administrador de Kafka (EP5) -> /api/v1/admin/kafka/** (solo rol Admin).
  kafka-admin:
    # Topicos de la arquitectura: eliminarlos exige ?force=true.
    protected-topics: jobs.events,jobs.events.report.DLT,jobs.events.audit.DLT,audit.timeline,audit.timeline.DLT
    timeout-ms: 10000
  jobs:
    kafka:
      topic-jobs-events: jobs.events
      partitions: 3
      replicas: ${KAFKA_REPLICAS:1}
      # 7 dias: ventana para reprocesar el historial (reset de offsets a EARLIEST).
      retention-ms: 604800000
      # Espejo compactado (clave = orderId) que consume audit; debe coincidir con
      # app.kafka.topics.audit-timeline de ms-tallerpro-audit.
      topic-audit-timeline: audit.timeline
    rabbitmq:
      exchange-cmd: cmd.direct
      exchange-dlx: cmd.dead.dlx
      queue-email: q.cmd.email
      queue-bay: q.cmd.bay
      queue-quote: q.cmd.quote
    catalog:
      base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
    outbox:
      publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      poll-fixed-delay-ms: 2000
      batch-size: 50
      # Backoff exponencial por evento: 5s, 10s, 20s, ... hasta 5 min. Con 10 intentos tolera
      # ~20 min de broker caido antes de marcar el evento FALLIDO.
      max-intentos: ${OUTBOX_MAX_INTENTOS:10}
      backoff-inicial-ms: 5000
      backoff-max-ms: 300000
    # Solo se usa si arrancas con --spring.profiles.active=demo (DemoDataSeeder).
    # Los destinatarios reales se pasan SOLO por variables de entorno
    # (DEMO_CLIENTE_EMAIL / DEMO_MECANICO_EMAIL); nunca escribir correos personales aqui.
    demo:
      cliente-email: ${DEMO_CLIENTE_EMAIL:cliente-demo@example.com}
      mecanico-email: ${DEMO_MECANICO_EMAIL:mecanico-demo@example.com}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.tallerpro.ms_tallerpro_jobs: INFO
