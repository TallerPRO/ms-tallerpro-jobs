spring:
  datasource:
    url: jdbc:h2:mem:jobs-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      fail-fast: false
  rabbitmq:
    host: localhost
    port: 5672

tallerpro:
  jobs:
    kafka:
      topic-jobs-events: jobs.events
      partitions: 1
      replicas: 1
    rabbitmq:
      exchange-cmd: cmd.direct
      exchange-dlx: cmd.dead.dlx
      queue-email: q.cmd.email
      queue-bay: q.cmd.bay
      queue-quote: q.cmd.quote
    catalog:
      base-url: http://localhost:8082
      connect-timeout-ms: 500
      read-timeout-ms: 500
    outbox:
      publisher-enabled: false
      poll-fixed-delay-ms: 999999999
      batch-size: 10
